[project]
name = "tweet-workshop"
version = "0.1.0"
description = "Workshop first-draft tweets that Studio writes from ideas posted in Slack, then pick and polish what gets posted"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "app-schema",
    "flask>=3.0",
    "flask-sock>=0.7",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "werkzeug>=3.0",
]

[project.scripts]
tweet-workshop = "tweet_workshop.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tweet_workshop"]

[dependency-groups]
dev = [
    # What runner_test.py asserts the API document with.
    "app-schema[testing]",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
