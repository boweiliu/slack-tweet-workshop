display_information:
  name: Tweet Drafter
  description: Turns tweet ideas posted in the channel into first drafts written to your voice guide.
  background_color: "#0b292b"
features:
  bot_user:
    display_name: Tweet Drafter
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
      - reactions:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
