# Machine-readable manifest for this template. The sibling
# template.md holds the prose, the Requirements list, and the two
# append-only history logs; this file is authoritative for everything
# below. Both are generated together -- validate_template.py fails if
# they disagree.
format = "v2"

[template]
slug = "slack-tweet-workshop"
title = "Slack Tweet Workshop"
description = "Turn tweet ideas your team drops in a Slack channel into first-draft tweets written to your voice guide, then pick, rework and file them in a shared workshop app."
thumbnail = "template.svg"
version = "v1"

# How this template is DERIVED from the workspace it came from. An
# update re-runs this recipe rather than diffing two repos, which is what
# keeps an exclusion excluded even though the thing still exists upstream.
[recipe]
include = ["system/apps/tweet_workshop/", "system/supervisord.conf.d/tweet-workshop.conf", "system/routines/tweet-idea-drafter.toml", ".agents/skills/tweet-workshop-setup/"]
data_include = []
# One entry per deliberate exclusion (paths left out, and
# features stripped from an included path). Leave [] if nothing was.
exclude = [
    "data/.apps/tweet-workshop/ (settings, the stored voice guide, drafted ideas and the team's workshop records)",
    "the live Slack bot token file the source workspace's routine sources",
]
# One entry per published-version modification, stated as a RULE
# and NEVER the removed value -- the point of a modification is that the
# value does not ship. e.g. "replace the hardcoded team channel with a
# neutral default". Leave [] if there were none.
modification_rules = [
    "run the drafter routine under system/scripts/with_secrets.py with the declared tweet-workshop-slack secret instead of sourcing a token file kept with the app's data",
    "rewrite the routine's description to say drafts are replied in the idea's Slack thread when posting is on",
    "ship the drafter routine switched off (enabled = false); the setup skill turns it on",
    "declare the Slack bot token secret in the setup skill's front matter so adopters are asked for it",
    "add the app to uv.lock as a workspace member so the build's frozen sync installs the drafter module",
]

# Everything an adopter must deal with before this is really theirs.
# One list -- but each entry's KIND says how it is handled, because the
# two are handled at different times by different mechanisms:
#
#   permission / secret / llm = ACTIVATION. The adopting agent acts on
#   these FIRST and BY ITSELF, initiating each latchkey permission
#   request and each secret request before asking the user anything.
#   Every one of them must have a matching requires_ line in template.md
#   and vice versa -- the validator checks that, because an adopter once
#   never got prompted for a permission the app needed.
#
#   The [[requirements.secret]] entries below were AGGREGATED from the
#   included apps' app.toml [[secrets]] and skills' SKILL.md secrets:
#   declarations, plus every data/.secrets/<file>.env the included
#   mcp-servers.json and supervisord programs run under. Fix a wrong one
#   at its declaration, not here.
#
#   adaptation = worked through INTERACTIVELY with the user afterwards.
#   Prose on both sides, so it is not cross-checked.
#
# e.g.:
#   [[requirements.permission]]
#   scope = "slack-api"
#   permission = "slack-read-all"
#
#   [requirements.llm]
#   method = "keyed"   # keyed (an API key, e.g. ANTHROPIC_API_KEY) | keyless (a subscription CLI, e.g. claude -p)
#
#   [[requirements.adaptation]]
#   summary = "the digest channel is hardcoded"
#   resolution = "ask the user which channel to watch"
[requirements]

[[requirements.secret]]
file = "tweet-workshop-slack"
variables = ["SLACK_BOT_TOKEN"]
note = "the Bot User OAuth Token (xoxb-...) of the Slack bot created from system/apps/tweet_workshop/slack_app_manifest.yaml"

[requirements.llm]
method = "keyless"
note = "Calls claude -p on the workspace's own Claude sign-in (no API key); the model is hardcoded as DRAFT_MODEL in tweet_workshop/drafter.py. On a keyed setup that should bill the key, switch the calls to litellm per use-ai-integration."

[[requirements.adaptation]]
summary = "no ideas channel or Slack workspace is configured"
resolution = "ask which channel the team posts ideas in, have the user invite @Tweet Drafter there, and run drafter configure with the channel ID, channel name and Slack workspace address"

[[requirements.adaptation]]
summary = "no brand or account name is set; drafts say 'the company'"
resolution = "ask what the account tweets as and run drafter configure --account-name"

[[requirements.adaptation]]
summary = "no voice guide ships, and the drafter refuses to run without one"
resolution = "ask the user for a link to their voice guide, read it through connect-external-service, save it as markdown under data/.tasks/, and store it with drafter set-voice-guide --url --file"

[[requirements.adaptation]]
summary = "Slack thread replies are on by default"
resolution = "ask whether drafts should also be replied in the idea's Slack thread and set drafter configure --post-to-slack on|off"

[[requirements.adaptation]]
summary = "the tweet-idea-drafter routine ships switched off"
resolution = "after the token, channel and guide are set, run routines enable tweet-idea-drafter and routines run tweet-idea-drafter"

[[requirements.adaptation]]
summary = "comments are attributed by a typed name, simultaneous saves are last-write-wins, and Slack thread replies are not pulled back into the app"
resolution = "tell the user about these limits; no change is needed to run"


# What the included code needs INSTALLED. apt takes bare names: versions
# are a function of the apt snapshot timestamp, so replaying names at the
# adopter's timestamp yields versions consistent with the rest of their
# environment. The other sources are not snapshot-pinned, so for them the
# recorded version IS the pin (name = version).
#
# From what the included code actually needs, e.g.:
#   apt = ["poppler-utils"]
#   [environment.npm_global]
#   "@slack/cli" = "2.1.0"
#   [environment.uv_tools]
#   yt-dlp = "2026.7.1"
#   [environment.cargo_crates]
#   fd-find = "9.0.0"
#
# For an install with no package database (a URL-fetched binary, a browser),
# ship a system/scripts/env.d/<NNNN>-<slug>-<name>.sh unit with NNNN >= 2000,
# include it in the recipe above, and list it in env_d_units.
[environment]
apt = []
env_d_units = []
